# Versioned artefact templates (FR-DOC-001: "using a versioned template"; ADR-007).
#
# Each entry fixes, for one artefact type, the template identifier and version
# stamped on every artefact version, the document title, and the fixed prose the
# deterministic assembler places into it. The assembler supplies only persisted,
# approved data around this text. Nothing here is generated by a model, and no
# project content is ever read as a template.
#
# Changing any text below is a template change: bump that entry's version so
# that artefacts rendered from the old wording remain attributable to it.
name: artefact_templates
version: "1.0.0"
description: >
  Titles, fixed prose and section outlines for the P8 artefacts: SRS, RTM, user
  stories, use cases, compliance-control matrix, risk register, assumptions and
  dependency register, open-issues list.

rules:
  srs:
    template_id: reqpilot.srs
    version: "1.0.0"
    title: Software Requirements Specification
    purpose: >-
      This Software Requirements Specification records the requirements in force
      as of the named baseline. Every requirement in it is an exact requirement
      version that passed gate G1 (Analyst and Compliance Officer co-approval) and
      entered a baseline; nothing that is unapproved, pending or superseded after
      that baseline appears as a requirement.
    conventions: >-
      Requirements are identified as FR-<DOMAIN>-nnn / NFR-<DOMAIN>-nnn with an
      explicit version number, for example FR-LOAN-001 v2. Every section states
      the requirement versions it traces to. A field the approved records do not
      contain is shown as "not recorded" - it is never filled in.
    empty_note: No approved baseline requirement populates this section.
  rtm:
    template_id: reqpilot.rtm
    version: "1.0.0"
    title: Requirements Traceability Matrix
    purpose: >-
      Each row is one exact requirement version in force as of the named baseline.
      Every cell is read from the persisted, typed trace graph. A relationship the
      graph does not hold is shown as not linked; nothing is inferred.
  user_stories:
    template_id: reqpilot.user_stories
    version: "1.0.0"
    title: User Stories
    purpose: >-
      One story per functional requirement version of the baseline. The role is
      the requirement's recorded source stakeholder; where no stakeholder is
      recorded the story says so rather than inventing one. The capability is the
      requirement statement itself, and the business value is the recorded
      justification. Acceptance criteria are the requirement's persisted
      Given/When/Then criteria; none are generated here.
  use_cases:
    template_id: reqpilot.use_cases
    version: "1.0.0"
    title: Use-Case Descriptions
    purpose: >-
      One use case per functional requirement version of the baseline. Only what
      the approved records contain is shown: the primary actor is the recorded
      source stakeholder, the goal is the requirement statement, the flows are the
      recorded acceptance criteria. Preconditions, triggers, alternate flows and
      postconditions that the records do not state are marked not recorded.
  compliance_matrix:
    template_id: reqpilot.compliance_matrix
    version: "1.0.0"
    title: Compliance-Control Matrix (candidate mappings)
    purpose: >-
      The candidate mappings recorded by compliance analysis for the requirement
      versions in force as of the named baseline, with their review status,
      evidence and the expected-control gaps. The matrix states what was mapped,
      what is a candidate and what requires human review. It is not a legal
      determination about any system or project.
  risk_register:
    template_id: reqpilot.risk_register
    version: "1.0.0"
    title: Threat and Risk Register
    purpose: >-
      The persisted risk register for the requirement versions in force as of the
      named baseline, plus the project-level risks. Severity is read from each
      risk as computed by the published likelihood x impact matrix; it is never
      recalculated here.
  assumptions_dependencies:
    template_id: reqpilot.assumptions_dependencies
    version: "1.0.0"
    title: Assumptions and Dependency Register
    purpose: >-
      The assumptions and dependencies recorded on the requirement versions in
      force as of the named baseline, each traced to the version that states it.
      An assumption listed here is not a requirement, and it is not verified by
      being listed.
  open_issues:
    template_id: reqpilot.open_issues
    version: "1.0.0"
    title: Open-Issues List
    purpose: >-
      Items that are still unresolved in the project's persisted records: open
      clarifications and quality findings, conflicts under review, expected-control
      gaps, risks not yet reviewed, and approval tasks still open. An item stays on
      this list until the appropriate human workflow closes it; listing it here
      does not resolve it.
