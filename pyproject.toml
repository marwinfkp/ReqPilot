[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reqpilot"
version = "0.1.0"
description = "Agentic requirements engineering and SDLC recommendation assistant (university SE project)"
readme = "README.md"
# Architecture ADR-002 proposes Python 3.12. A floor is used rather than an exact
# pin because 3.12 is not installed on the current development machine; see
# docs/03-p0-foundations.md "Environment deviations".
requires-python = ">=3.12"
license = { text = "UNLICENSED" }

# Dependency discipline (P0 instruction 9): each dependency arrives with the
# roadmap phase that uses it. P2 (knowledge base & RAG) added the pgvector
# adapter and the two parsers architecture J.2 names; the embedding model is an
# optional extra (below). P3 (extraction & classification) built the gateway,
# validation and review queue on what exists; at P3 closure the team selected
# OpenAI as the provider (architecture Y), whose SDK is an optional extra
# (below), imported only when LLM_PROVIDER=openai. Still deliberately absent:
# document generation and evaluation tooling.
dependencies = [
    "pydantic>=2.7",              # ADR-002: one type system for API, contracts, graph state
    "pydantic-settings>=2.3",     # ADR-011: typed, fail-fast configuration
    "sqlalchemy>=2.0",            # ADR-003
    "alembic>=1.13",              # ADR-003: migrations
    "psycopg[binary]>=3.1",       # ADR-003: PostgreSQL driver
    "fastapi>=0.111",             # ADR-002: API layer boundary + health check
    "uvicorn>=0.30",              # ADR-002: development server
    "langgraph>=0.2",             # ADR-001: mandated orchestration framework
    "langgraph-checkpoint-postgres>=2.0",  # architecture C.7: checkpoint store
    "pyyaml>=6.0",                # architecture DQ-03: versioned rule/config data files
    "jinja2>=3.1",                # ADR-008: server-rendered UI templates
    "python-multipart>=0.0.9",    # ADR-008: HTML form submissions
    "pgvector>=0.3",              # ADR-004: vector column type and distance operators
    "pypdf>=4.0",                 # J.2: PDF text extraction for curated sources
    "python-docx>=1.1",           # J.2: DOCX text extraction for curated sources
]

[project.optional-dependencies]
# ADR-005: the approved local embedding model (BAAI/bge-small-en-v1.5 on CPU).
# An extra rather than a core dependency because it brings a deep-learning
# runtime: the offline test suite (ET-10) and CI do not need it, and use a
# deterministic stand-in instead. The application needs it to ingest or retrieve
# for real, and refuses clearly if it is missing.
embeddings = [
    "sentence-transformers>=3.0",
]
# ADR-006 / architecture Y: the OpenAI provider behind the gateway (selected at
# P3 closure). An extra so a keyless, offline install carries no provider SDK;
# selecting LLM_PROVIDER=openai without it fails at startup with this hint.
openai = [
    "openai>=3.16,<4",
]
dev = [
    # The adapter's offline tests use the SDK's own error types (never the network).
    "openai>=3.16,<4",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",                  # formatting + linting
    "mypy>=1.10",                 # type checking
    "import-linter>=2.0",         # architecture V: enforces the dependency direction rule
]

[tool.hatch.build.targets.wheel]
packages = ["src/reqpilot"]

# ---------------------------------------------------------------------------
# Tests (ADR-012)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The `llm` mark is opt-in and excluded by default so the default suite makes
# zero external API calls (Phase 0 target ET-10).
addopts = "-m 'not llm' --strict-markers"
markers = [
    "unit: deterministic logic, no I/O",
    "integration: database, retrieval, gateway, artefacts",
    "workflow: full graph paths, fixture-replayed",
    "security: injection, RBAC, isolation, gate-bypass",
    "llm: requires a real LLM provider - opt-in only, never in CI",
]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Frozen evaluation data is hashed (data/gold/README.md): no tool may reformat it.
extend-exclude = ["data/gold"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # assert: used throughout the test suite
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]
# `Form(...)` in a parameter default is FastAPI's required idiom for HTML form
# handling; there is no alternative spelling.
"src/reqpilot/web/router.py" = ["B008"]
"src/reqpilot/web/knowledge.py" = ["B008"]
"src/reqpilot/web/extraction.py" = ["B008"]
"src/reqpilot/web/elicitation.py" = ["B008"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
packages = ["reqpilot"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
# Third-party stubs are uneven this early; tighten as the codebase grows.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Architecture boundaries (architecture section V, section A.4)
#
# THE load-bearing rule: the domain must stay usable, and testable, with no
# LangGraph and no LLM code installed. This is the structural expression of
# "governance lives outside the LLM" (architecture J.1).
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["reqpilot"]
# Required so that contracts can forbid external packages by name - which is the
# point of the first contract: the domain must not reach LangGraph itself, not
# merely our wrapper around it.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is independent of orchestration and LLM code"
type = "forbidden"
source_modules = [
    "reqpilot.domain",
    "reqpilot.repositories",
    "reqpilot.services",
    # M5 (P2): retrieval is deterministic and must not become a route by which
    # governance comes to depend on a model.
    "reqpilot.retrieval",
]
forbidden_modules = [
    "reqpilot.graph",
    "reqpilot.agents",
    "reqpilot.llm",
    "langgraph",
]

[[tool.importlinter.contracts]]
name = "Layered dependency direction: main -> web -> api -> services -> repositories -> retrieval -> domain"
type = "layers"
# M5's pure components (retrieval) sit below the repositories and above the
# domain: services and repositories may use them; they may use only the domain.
layers = [
    "reqpilot.main",
    "reqpilot.web",
    "reqpilot.api",
    "reqpilot.services",
    "reqpilot.repositories",
    "reqpilot.retrieval",
    "reqpilot.domain",
]

[[tool.importlinter.contracts]]
name = "Domain does not depend on the web or API layer"
type = "forbidden"
source_modules = ["reqpilot.domain"]
forbidden_modules = ["reqpilot.api", "reqpilot.web", "fastapi"]

# P3: agent roles propose; they never write. A role reaches the model through
# the gateway and returns a typed proposal - it cannot import a repository, a
# service, the graph or the web/API layer, so it has no path to persistence or
# to another role (architecture E.1: "Writes: propose").
[[tool.importlinter.contracts]]
name = "Agent roles propose only: no persistence, services or orchestration"
type = "forbidden"
source_modules = ["reqpilot.agents"]
forbidden_modules = [
    "reqpilot.repositories",
    "reqpilot.services",
    "reqpilot.graph",
    "reqpilot.api",
    "reqpilot.web",
]

# P3: the gateway is infrastructure below everything that decides. It may not
# reach the repositories, services, agents, graph, or the web/API layer.
[[tool.importlinter.contracts]]
name = "The LLM gateway depends on no application layer"
type = "forbidden"
source_modules = ["reqpilot.llm"]
forbidden_modules = [
    "reqpilot.repositories",
    "reqpilot.services",
    "reqpilot.agents",
    "reqpilot.graph",
    "reqpilot.api",
    "reqpilot.web",
]
