# ReqPilot CI
#
# Two properties this workflow guarantees, both required by the architecture:
#
#   * **Zero external API calls.** No provider key is configured and none is
#     needed: LLM_PROVIDER=stub. A job that needed a credential would make the
#     build unreproducible for anyone without one.
#   * **Architecture boundaries are enforced, not documented.** The import
#     contracts run on every push, so "the domain does not depend on LangGraph"
#     stays true rather than being true only on the day it was written.
#
# No deployment infrastructure is required.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  # Offline, deterministic, no credentials.
  LLM_PROVIDER: stub
  LLM_FIXTURE_MODE: replay
  LANGGRAPH_CHECKPOINT_BACKEND: memory
  REQPILOT_ENV: test

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # ADR-002 targets 3.12; 3.13 is also supported. See
          # docs/03-p0-foundations.md "Environment deviations".
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Architecture import contracts
        run: lint-imports

      - name: Tests (offline; the `llm` mark is excluded by default)
        run: pytest -q

      # P0 had no provider SDK. At P3 closure OpenAI was selected (architecture Y)
      # and its SDK is an approved dependency (the `openai` extra, and `dev` for
      # the adapter's offline tests). Every other provider SDK is still refused:
      # the allowlist lives in the script, and changing it is a deliberate act.
      # No model is called here - the offline tests above run LLM_PROVIDER=stub.
      - name: Assert only approved provider SDKs are in the dependency tree
        run: python scripts/check_provider_sdks.py