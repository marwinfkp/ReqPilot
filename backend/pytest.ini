[pytest]
# Run from the backend folder:  .venv\Scripts\python.exe -m pytest
testpaths = tests
pythonpath = .
# -p no:cacheprovider: do not create backend/.pytest_cache
addopts = -ra -p no:cacheprovider
markers =
    slow: exports and the full benchmark evaluation (still only a few seconds each)
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
