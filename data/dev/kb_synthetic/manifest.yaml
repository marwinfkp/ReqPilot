# SYNTHETIC development knowledge base - FICTIONAL CONTENT ONLY.
#
# Every source below is invented for ReqPilot development and demonstration.
# "Acme Bank" does not exist; these are not any real institution's policies,
# and nothing here is a law, a regulation, a regulator's guidance or a standard.
#
# Approved Phase 0 D.2 permits exactly this: synthetic organisational policies,
# clearly labelled fictional, to demonstrate policy mapping without using any
# real institution's documents. Real normative material (statutes, regulator
# directions, public frameworks) belongs in data/kb_seed/, curated and verified
# by a person against the issuing body's published text.
#
# Load with:  python scripts/seed_kb.py --manifest data/dev/kb_synthetic/manifest.yaml --actor <user id of a Knowledge-Base Administrator>

manifest_version: 1
synthetic: true
description: >
  Fictional Acme Bank policies and a team-written requirements practice note,
  for developing and demonstrating curation, allowlisting, hybrid retrieval,
  evidence and citation resolution.

sources:
  - source_type: org_policy
    issuing_body: Acme Bank (fictional)
    title: Acme Bank Access Control Policy (fictional)
    jurisdiction: IN
    version: "2026.1"
    effective_date: 2026-01-01
    retrieved_at: 2026-09-21
    licence_class: synthetic
    licence_note: Fictional policy written for ReqPilot development. Not a real institution's document.
    items:
      - item_key: SYN-ACME-AC-2
        title: Least privilege and access review
        clause_ref: "2"
        text_origin: synthetic
        applicability: [access_control, loan_origination]
        text: |
          2. Least privilege
          2.1 Access to customer personal data is granted only on a least-privilege basis, for a documented business purpose.
          2.2 Every access right to the loan origination system is reviewed by the data owner at least quarterly.
          2.3 Access that is no longer needed is revoked within five working days of the review.
      - item_key: SYN-ACME-AC-3
        title: Privileged access
        clause_ref: "3"
        text_origin: synthetic
        applicability: [access_control, security]
        text: |
          3. Privileged access
          3.1 Administrator accounts require multi-factor authentication and are separate from everyday accounts.
          3.2 Every privileged session is logged with the operator identity, start time and end time.

