  - source_type: org_policy
    issuing_body: Acme Bank (fictional)
    title: Acme Bank Borrower Communication Policy (fictional)
    jurisdiction: IN
    version: "2026.1"
    effective_date: 2026-01-01
    retrieved_at: 2026-09-21
    licence_class: synthetic
    licence_note: Fictional policy written for ReqPilot development. Not a real institution's document.
    items:
      - item_key: SYN-ACME-COM-1
        title: Fee disclosure before sanction
        clause_ref: "1"
        text_origin: synthetic
        applicability: [loan_origination, disclosure]
        text: |
          1. Fee disclosure
          1.1 Before a loan is sanctioned, the applicant receives a one-page summary of every fee, charge and the annual percentage rate.
          1.2 The summary is provided in the language the applicant chose at onboarding.
          1.3 The applicant's acknowledgement of the summary is recorded with a timestamp.
      - item_key: SYN-ACME-COM-2
        title: Grievance handling
        clause_ref: "2"
        text_origin: synthetic
        applicability: [loan_origination, grievance]
        text: |
          2. Grievances
          2.1 A borrower complaint is acknowledged within two working days and resolved or escalated within thirty days.
          2.2 Each complaint receives a reference number that the borrower can use to track it.

