    issuing_body: Acme Bank Singapore Branch (fictional)
    title: Acme Bank Singapore Branch Incident Logging Standard (fictional)
    jurisdiction: SG
    version: "2026.1"
    effective_date: 2026-01-01
    retrieved_at: 2026-09-21
    licence_class: synthetic
    licence_note: Fictional policy written for ReqPilot development. Not a real institution's document.
    items:
      - item_key: SYN-ACME-SG-INC-1
        title: Security incident logging
        clause_ref: "1"
        text_origin: synthetic
        applicability: [security, audit]
        text: |
          1. Incident logging
          1.1 Every suspected security incident is logged within one hour of detection with its time, affected system and reporter.
          1.2 Incident logs are retained for at least five years and protected against modification.

  - source_type: best_practice
    issuing_body: ReqPilot project team
    title: Team note on writing testable requirements (synthetic)
    jurisdiction: INTL
    version: "1.0"
    retrieved_at: 2026-09-21
    licence_class: synthetic
    licence_note: Team-written summary of general requirements-engineering practice for ReqPilot development.
    items:
      - item_key: SYN-TEAM-RE-1
        title: Testable requirement statements
        text_origin: synthetic
        applicability: [quality]
        text: |
          A requirement is testable when an observer can decide, without interpretation, whether a delivered system satisfies it.
          Vague qualifiers such as fast, secure or user-friendly should be replaced by measurable criteria, for example a response time under two seconds for ninety-five percent of requests.
          Each requirement should state one obligation, name its source, and carry acceptance criteria.
